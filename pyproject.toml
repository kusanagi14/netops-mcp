[project]
name = "netops-mcp"
version = "0.1.0"
description = "MCP server for network automation: FortiGate, Cisco Catalyst 9500, Catalyst Center"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
netops-mcp = "netops_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netops_mcp"]
